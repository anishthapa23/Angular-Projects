   
   
   <div class="body">
    
       <div style="text-align: center;">
           <h1 style="color: rgb(116, 73, 20);font-family: 'Courier New'; text-decoration: underline;">Counter App</h1>
           <h2 class="counter">{{ count }}</h2>
           <button type="button" (click)="handleCounter('minus')" class="btn bg-red">Decrement</button>
           <button type="button" (click)="handleCounter('reset')" class="btn bg-blue">Reset</button>
           <button type="button" (click)="handleCounter('plus')" class="btn bg-green">Increment</button>
        </div>
    </div>
